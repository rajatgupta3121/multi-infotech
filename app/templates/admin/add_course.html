{% extends "base.html" %}

{% block content %}

<div class="admin-page py-5">

    <div class="container">

        <!-- ================= HEADER ================= -->

        <div class="page-header mb-5">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                <div>

                    <span class="page-badge">
                        🚀 Multi Infotech Admin
                    </span>

                    <h1 class="fw-bold mt-3 mb-2">

                        Add New Course

                    </h1>

                    <p class="text-muted mb-0">

                        Create and publish a professional course for students.

                    </p>

                </div>

                <a href="{{ url_for('admin.admin_courses') }}"
                   class="btn btn-dark rounded-pill px-4 py-2">

                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Back to Courses

                </a>

            </div>

        </div>

        <!-- ================= FORM CARD ================= -->

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <div class="form-card">

                    <div class="form-header">

                        <div class="header-icon">

                            <i class="fa-solid fa-book-open"></i>

                        </div>

                        <div>

                            <h3 class="fw-bold mb-1">

                                Course Details

                            </h3>

                            <p class="text-muted mb-0">

                                Fill all required information carefully.

                            </p>

                        </div>

                    </div>

                    <form method="POST"
                          enctype="multipart/form-data">

                        <div class="row g-4">

                            <!-- COURSE TITLE -->

                            <div class="col-12">

                                <label class="form-label fw-semibold">

                                    Course Title

                                </label>

                                <div class="input-group custom-input">

                                    <span class="input-group-text">

                                        <i class="fa-solid fa-book"></i>

                                    </span>

                                    <input type="text"
                                           name="title"
                                           class="form-control"
                                           placeholder="Enter course title"
                                           required>

                                </div>

                            </div>

                            <!-- DESCRIPTION -->

                            <div class="col-12">

                                <label class="form-label fw-semibold">

                                    Course Description

                                </label>

                                <textarea name="description"
                                          class="form-control custom-textarea"
                                          rows="6"
                                          placeholder="Write detailed course description..."
                                          required></textarea>

                            </div>

                            <!-- DURATION -->

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">

                                    Duration

                                </label>

                                <div class="input-group custom-input">

                                    <span class="input-group-text">

                                        <i class="fa-solid fa-clock"></i>

                                    </span>

                                    <input type="text"
                                           name="duration"
                                           class="form-control"
                                           placeholder="e.g. 6 Months">

                                </div>

                            </div>

                            <!-- FEES -->

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">

                                    Fees

                                </label>

                                <div class="input-group custom-input">

                                    <span class="input-group-text">

                                        ₹

                                    </span>

                                    <input type="text"
                                           name="fees"
                                           class="form-control"
                                           placeholder="e.g. 25000">

                                </div>

                            </div>

                            <!-- CATEGORY -->

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">

                                    Category

                                </label>

                                <select name="category"
                                        class="form-select custom-select">

                                    <option value="">
                                        Select Category
                                    </option>

                                    <option value="Programming">
                                        Programming
                                    </option>

                                    <option value="Data Science">
                                        Data Science
                                    </option>

                                    <option value="AI & ML">
                                        AI & ML
                                    </option>

                                    <option value="Cyber Security">
                                        Cyber Security
                                    </option>

                                    <option value="Cloud Computing">
                                        Cloud Computing
                                    </option>

                                    <option value="Web Development">
                                        Web Development
                                    </option>

                                    <option value="Digital Marketing">
                                        Digital Marketing
                                    </option>

                                </select>

                            </div>

                            <!-- LEVEL -->

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">

                                    Difficulty Level

                                </label>

                                <select name="level"
                                        class="form-select custom-select">

                                    <option value="">
                                        Select Level
                                    </option>

                                    <option value="Beginner">
                                        Beginner
                                    </option>

                                    <option value="Intermediate">
                                        Intermediate
                                    </option>

                                    <option value="Advanced">
                                        Advanced
                                    </option>

                                </select>

                            </div>

                            <!-- IMAGE -->

                            <div class="col-12">

                                <label class="form-label fw-semibold">

                                    Course Image

                                </label>

                                <div class="upload-box">

                                    <input type="file"
                                           name="image"
                                           class="form-control upload-input">

                                    <div class="upload-content">

                                        <i class="fa-solid fa-cloud-arrow-up"></i>

                                        <p class="mb-0 mt-2">

                                            Upload course thumbnail image

                                        </p>

                                        <small class="text-muted">

                                            JPG, PNG supported

                                        </small>

                                    </div>

                                </div>

                            </div>

                            <!-- SUBMIT BUTTON -->

                            <div class="col-12 mt-4">

                                <button type="submit"
                                        class="btn submit-btn w-100">

                                    <i class="fa-solid fa-plus me-2"></i>

                                    Add Course

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<style>

/* =========================
   PAGE
========================= */

.admin-page{

    min-height:100vh;
    background:#f4f7fb;
}

/* =========================
   HEADER
========================= */

.page-badge{

    background:#0d6efd;
    color:white;
    padding:10px 18px;
    border-radius:50px;
    font-size:14px;
    font-weight:600;
}

.page-header h1{

    font-size:3rem;
}

/* =========================
   FORM CARD
========================= */

.form-card{

    background:white;
    border-radius:35px;
    padding:45px;
    box-shadow:0 15px 40px rgba(0,0,0,0.06);
}

.form-header{

    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:40px;
}

.header-icon{

    width:80px;
    height:80px;
    border-radius:25px;
    background:linear-gradient(45deg,#0d6efd,#6610f2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:32px;
}

/* =========================
   INPUTS
========================= */

.form-label{

    margin-bottom:10px;
    color:#222;
}

.custom-input{

    border-radius:18px;
    overflow:hidden;
    border:1px solid #e5e7eb;
    transition:0.3s;
}

.custom-input:focus-within{

    border-color:#0d6efd;
    box-shadow:0 0 0 4px rgba(13,110,253,0.1);
}

.custom-input .input-group-text{

    background:white;
    border:none;
    padding-left:20px;
    color:#666;
}

.custom-input .form-control{

    border:none;
    height:58px;
    box-shadow:none;
}

.custom-textarea{

    border-radius:20px;
    border:1px solid #e5e7eb;
    padding:18px;
    resize:none;
    transition:0.3s;
}

.custom-textarea:focus{

    border-color:#0d6efd;
    box-shadow:0 0 0 4px rgba(13,110,253,0.1);
}

.custom-select{

    height:58px;
    border-radius:18px;
    border:1px solid #e5e7eb;
    padding:10px 18px;
}

.custom-select:focus{

    border-color:#0d6efd;
    box-shadow:0 0 0 4px rgba(13,110,253,0.1);
}

/* =========================
   UPLOAD
========================= */

.upload-box{

    position:relative;
    border:2px dashed #cbd5e1;
    border-radius:25px;
    padding:40px 20px;
    text-align:center;
    transition:0.3s;
    overflow:hidden;
}

.upload-box:hover{

    border-color:#0d6efd;
    background:#f8fbff;
}

.upload-input{

    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
}

.upload-content i{

    font-size:48px;
    color:#0d6efd;
}

/* =========================
   BUTTON
========================= */

.submit-btn{

    height:60px;
    border:none;
    border-radius:18px;
    background:linear-gradient(45deg,#0d6efd,#6610f2);
    color:white;
    font-size:18px;
    font-weight:600;
    transition:0.4s;
}

.submit-btn:hover{

    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(13,110,253,0.25);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

    .form-card{

        padding:25px;
        border-radius:25px;
    }

    .page-header h1{

        font-size:2.2rem;
    }

    .form-header{

        flex-direction:column;
        text-align:center;
    }

}

</style>

{% endblock %}
