{% extends "base.html" %}

{% block content %}

<h2>Leads</h2>

<table class="table table-bordered">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Message</th>
    </tr>

    {% for lead in leads %}
    <tr>
        <td>{{ lead.name }}</td>
        <td>{{ lead.email }}</td>
        <td>{{ lead.phone }}</td>
        <td>{{ lead.message }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
