{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="card shadow border-0">

        <div class="card-header">
            <h3>Edit Course</h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label>Course Title</label>
                    <input type="text"
                           name="title"
                           class="form-control"
                           value="{{ course.title }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Description</label>
                    <textarea name="description"
                              class="form-control"
                              rows="5">{{ course.description }}</textarea>
                </div>

                <div class="mb-3">
                    <label>Duration</label>
                    <input type="text"
                           name="duration"
                           class="form-control"
                           value="{{ course.duration }}">
                </div>

                <div class="mb-3">
                    <label>Fees</label>
                    <input type="text"
                           name="fees"
                           class="form-control"
                           value="{{ course.fees }}">
                </div>

                <div class="mb-3">
                    <label>Category</label>
                    <input type="text"
                           name="category"
                           class="form-control"
                           value="{{ course.category }}">
                </div>

                <div class="mb-3">
                    <label>Level</label>
                    <input type="text"
                           name="level"
                           class="form-control"
                           value="{{ course.level }}">
                </div>

                <div class="mb-3">
                    <label>Course Image</label>
                    <input type="file"
                           name="image"
                           class="form-control">
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Update Course
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
